name: pi-monitor

services:
  influxdb:
    image: influxdb:2.10.1
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_ADMIN_USER:?required}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD:?required}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_ADMIN_TOKEN:?required}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:?required}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:?required}
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:13.3.1
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?required}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      INFLUXDB_TOKEN: ${GRAFANA_INFLUXDB_TOKEN:?required}
      INFLUXDB_ORG: ${INFLUXDB_ORG:?required}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:?required}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  telegraf:
    image: telegraf:1.40.3
    command: ["telegraf", "--config", "/etc/telegraf/telegraf.conf", "--config-directory", "/etc/telegraf/telegraf.d"]
    restart: unless-stopped
    environment:
      INFLUXDB_TOKEN: ${TELEGRAF_INFLUXDB_TOKEN:?required}
      INFLUXDB_ORG: ${INFLUXDB_ORG:?required}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:?required}
      HOST_PROC: /host/proc
      HOST_SYS: /host/sys
      HOST_MOUNT_PREFIX: /hostfs
      IDRAC_SNMP_USER: ${IDRAC_SNMP_USER:?required}
      IDRAC_SNMP_AUTH_PASSWORD: ${IDRAC_SNMP_AUTH_PASSWORD:?required}
      IDRAC_SNMP_PRIV_PASSWORD: ${IDRAC_SNMP_PRIV_PASSWORD:?required}
      IDRAC_REDFISH_USER: ${IDRAC_REDFISH_USER:?required}
      IDRAC_REDFISH_PASSWORD: ${IDRAC_REDFISH_PASSWORD:?required}
      ZYXEL_SNMP_USER: ${ZYXEL_SNMP_USER:?required}
      ZYXEL_SNMP_AUTH_PASSWORD: ${ZYXEL_SNMP_AUTH_PASSWORD:?required}
      ZYXEL_SNMP_PRIV_PASSWORD: ${ZYXEL_SNMP_PRIV_PASSWORD:?required}
      CISCO_SNMP_USER: ${CISCO_SNMP_USER:?required}
      CISCO_SNMP_AUTH_PASSWORD: ${CISCO_SNMP_AUTH_PASSWORD:?required}
      CISCO_SNMP_PRIV_PASSWORD: ${CISCO_SNMP_PRIV_PASSWORD:?required}
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - ./telegraf/telegraf.d:/etc/telegraf/telegraf.d:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/hostfs:ro,rslave
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
#     ports:
#       - "192.168.10.24:162:1162/udp"


volumes:
  influxdb-data:
  influxdb-config:
  grafana-data:
