# Cisco SG350-10MP interface monitoring
[[inputs.snmp]]
  agents = ["udp://192.168.10.6:161"]
  version = 3
  agent_host_tag = "source"
  interval = "10s"
  timeout = "5s"
  retries = 1

  sec_name = "${CISCO_SNMP_USER}"
  sec_level = "authPriv"
  auth_protocol = "SHA512"
  auth_password = "${CISCO_SNMP_AUTH_PASSWORD}"
  priv_protocol = "AES"
  priv_password = "${CISCO_SNMP_PRIV_PASSWORD}"

  [[inputs.snmp.table]]
    name = "cisco_interface"
    index_as_tag = true

    [[inputs.snmp.table.field]]
      name = "ifDescr"
      oid = ".1.3.6.1.2.1.2.2.1.2"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "ifAlias"
      oid = ".1.3.6.1.2.1.31.1.1.1.18"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "ifHCInOctets"
      oid = ".1.3.6.1.2.1.31.1.1.1.6"

    [[inputs.snmp.table.field]]
      name = "ifHCOutOctets"
      oid = ".1.3.6.1.2.1.31.1.1.1.10"

    [[inputs.snmp.table.field]]
      name = "ifHighSpeed"
      oid = ".1.3.6.1.2.1.31.1.1.1.15"

    [[inputs.snmp.table.field]]
      name = "ifOperStatus"
      oid = ".1.3.6.1.2.1.2.2.1.8"

    [[inputs.snmp.table.field]]
      name = "ifInDiscards"
      oid = ".1.3.6.1.2.1.2.2.1.13"

    [[inputs.snmp.table.field]]
      name = "ifInErrors"
      oid = ".1.3.6.1.2.1.2.2.1.14"

    [[inputs.snmp.table.field]]
      name = "ifOutDiscards"
      oid = ".1.3.6.1.2.1.2.2.1.19"

    [[inputs.snmp.table.field]]
      name = "ifOutErrors"
      oid = ".1.3.6.1.2.1.2.2.1.20"

# Zyxel XS1930-10 system monitoring
