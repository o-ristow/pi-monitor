# Zyxel XS1930-10 interface monitoring
[[inputs.snmp]]
  agents = ["udp://192.168.10.7:161"]
  version = 3
  agent_host_tag = "source"
  interval = "10s"
  timeout = "5s"
  retries = 1

  sec_name = "${ZYXEL_SNMP_USER}"
  sec_level = "authPriv"
  auth_protocol = "SHA"
  auth_password = "${ZYXEL_SNMP_AUTH_PASSWORD}"
  priv_protocol = "AES"
  priv_password = "${ZYXEL_SNMP_PRIV_PASSWORD}"

  [[inputs.snmp.table]]
    name = "zyxel_interface"
    index_as_tag = true

    [[inputs.snmp.table.field]]
      name = "ifDescr"
      oid = ".1.3.6.1.2.1.2.2.1.2"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "ifAlias"
      oid = ".1.3.6.1.2.1.31.1.1.1.18"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "ifHCInOctets"
      oid = ".1.3.6.1.2.1.31.1.1.1.6"

    [[inputs.snmp.table.field]]
      name = "ifHCOutOctets"
      oid = ".1.3.6.1.2.1.31.1.1.1.10"

    [[inputs.snmp.table.field]]
      name = "ifHighSpeed"
      oid = ".1.3.6.1.2.1.31.1.1.1.15"

    [[inputs.snmp.table.field]]
      name = "ifOperStatus"
      oid = ".1.3.6.1.2.1.2.2.1.8"

    [[inputs.snmp.table.field]]
      name = "ifInDiscards"
      oid = ".1.3.6.1.2.1.2.2.1.13"

    [[inputs.snmp.table.field]]
      name = "ifInErrors"
      oid = ".1.3.6.1.2.1.2.2.1.14"

    [[inputs.snmp.table.field]]
      name = "ifOutDiscards"
      oid = ".1.3.6.1.2.1.2.2.1.19"

    [[inputs.snmp.table.field]]
      name = "ifOutErrors"
      oid = ".1.3.6.1.2.1.2.2.1.20"

# Zyxel XS1930-10 system monitoring
[[inputs.snmp]]
  name = "zyxel_system"
  agents = ["udp://192.168.10.7:161"]
  version = 3
  agent_host_tag = "source"
  interval = "15s"
  timeout = "5s"
  retries = 1

  sec_name = "${ZYXEL_SNMP_USER}"
  sec_level = "authPriv"
  auth_protocol = "SHA"
  auth_password = "${ZYXEL_SNMP_AUTH_PASSWORD}"
  priv_protocol = "AES"
  priv_password = "${ZYXEL_SNMP_PRIV_PASSWORD}"

  [[inputs.snmp.field]]
    name = "uptime"
    oid = ".1.3.6.1.2.1.1.3.0"

  [[inputs.snmp.field]]
    name = "cpu_usage"
    oid = ".1.3.6.1.4.1.890.1.15.3.2.4.0"

  [[inputs.snmp.field]]
    name = "memory_usage"
    oid = ".1.3.6.1.4.1.890.1.15.3.2.5.0"

  [[inputs.snmp.field]]
    name = "cpu_5sec"
    oid = ".1.3.6.1.4.1.890.1.15.3.2.7.0"

  [[inputs.snmp.field]]
    name = "cpu_1min"
    oid = ".1.3.6.1.4.1.890.1.15.3.2.8.0"

  [[inputs.snmp.field]]
    name = "cpu_5min"
    oid = ".1.3.6.1.4.1.890.1.15.3.2.9.0"

# Zyxel XS1930-10 hardware monitoring
[[inputs.snmp]]
  agents = ["udp://192.168.10.7:161"]
  version = 3
  agent_host_tag = "source"
  interval = "15s"
  timeout = "5s"
  retries = 1

  sec_name = "${ZYXEL_SNMP_USER}"
  sec_level = "authPriv"
  auth_protocol = "SHA"
  auth_password = "${ZYXEL_SNMP_AUTH_PASSWORD}"
  priv_protocol = "AES"
  priv_password = "${ZYXEL_SNMP_PRIV_PASSWORD}"

  # ZYXEL-HW-MONITOR-MIB: Temperature
  [[inputs.snmp.table]]
    name = "zyxel_temperature"
    index_as_tag = true

    [[inputs.snmp.table.field]]
      name = "sensor"
      oid = ".1.3.6.1.4.1.890.1.15.3.26.1.2.1.2"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "current"
      oid = ".1.3.6.1.4.1.890.1.15.3.26.1.2.1.3"

    [[inputs.snmp.table.field]]
      name = "maximum"
      oid = ".1.3.6.1.4.1.890.1.15.3.26.1.2.1.4"

    [[inputs.snmp.table.field]]
      name = "minimum"
      oid = ".1.3.6.1.4.1.890.1.15.3.26.1.2.1.5"

    [[inputs.snmp.table.field]]
      name = "threshold"
      oid = ".1.3.6.1.4.1.890.1.15.3.26.1.2.1.6"

    [[inputs.snmp.table.field]]
      name = "status"
      oid = ".1.3.6.1.4.1.890.1.15.3.26.1.2.1.7"

  # ZYXEL-HW-MONITOR-MIB: Fan speed
  [[inputs.snmp.table]]
    name = "zyxel_fan"
    index_as_tag = true

    [[inputs.snmp.table.field]]
      name = "sensor"
      oid = ".1.3.6.1.4.1.890.1.15.3.26.1.1.1.2"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "current"
      oid = ".1.3.6.1.4.1.890.1.15.3.26.1.1.1.3"

    [[inputs.snmp.table.field]]
      name = "maximum"
      oid = ".1.3.6.1.4.1.890.1.15.3.26.1.1.1.4"

    [[inputs.snmp.table.field]]
      name = "minimum"
      oid = ".1.3.6.1.4.1.890.1.15.3.26.1.1.1.5"

    [[inputs.snmp.table.field]]
      name = "threshold"
      oid = ".1.3.6.1.4.1.890.1.15.3.26.1.1.1.6"

    [[inputs.snmp.table.field]]
      name = "status"
      oid = ".1.3.6.1.4.1.890.1.15.3.26.1.1.1.7"

  # ZYXEL-HW-MONITOR-MIB: Voltage in mV
  [[inputs.snmp.table]]
    name = "zyxel_voltage"
    index_as_tag = true

    [[inputs.snmp.table.field]]
      name = "sensor"
      oid = ".1.3.6.1.4.1.890.1.15.3.26.1.3.1.2"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "current"
      oid = ".1.3.6.1.4.1.890.1.15.3.26.1.3.1.3"

    [[inputs.snmp.table.field]]
      name = "maximum"
      oid = ".1.3.6.1.4.1.890.1.15.3.26.1.3.1.4"

    [[inputs.snmp.table.field]]
      name = "minimum"
      oid = ".1.3.6.1.4.1.890.1.15.3.26.1.3.1.5"

    [[inputs.snmp.table.field]]
      name = "nominal"
      oid = ".1.3.6.1.4.1.890.1.15.3.26.1.3.1.6"

    [[inputs.snmp.table.field]]
      name = "threshold"
      oid = ".1.3.6.1.4.1.890.1.15.3.26.1.3.1.7"

    [[inputs.snmp.table.field]]
      name = "status"
      oid = ".1.3.6.1.4.1.890.1.15.3.26.1.3.1.8"


# Zyxel XS1930-10 inventory
[[inputs.snmp]]
  name = "zyxel_inventory"
  agents = ["udp://192.168.10.7:161"]
  version = 3
  agent_host_tag = "source"
  interval = "300s"
  timeout = "5s"
  retries = 1

  sec_name = "${ZYXEL_SNMP_USER}"
  sec_level = "authPriv"
  auth_protocol = "SHA"
  auth_password = "${ZYXEL_SNMP_AUTH_PASSWORD}"
  priv_protocol = "AES"
  priv_password = "${ZYXEL_SNMP_PRIV_PASSWORD}"

  [[inputs.snmp.field]]
    name = "firmware"
    oid = ".1.3.6.1.4.1.890.1.15.3.1.6.0"

  [[inputs.snmp.field]]
    name = "model"
    oid = ".1.3.6.1.4.1.890.1.15.3.1.11.0"

  [[inputs.snmp.field]]
    name = "serial_number"
    oid = ".1.3.6.1.4.1.890.1.15.3.1.12.0"

  [[inputs.snmp.field]]
    name = "hardware_major"
    oid = ".1.3.6.1.4.1.890.1.15.3.1.13.0"

  [[inputs.snmp.field]]
    name = "hardware_minor"
    oid = ".1.3.6.1.4.1.890.1.15.3.1.14.0"


# Zyxel XS1930-10 LLDP neighbours
[[inputs.snmp]]
  agents = ["udp://192.168.10.7:161"]
  version = 3
  agent_host_tag = "source"
  interval = "300s"
  timeout = "5s"
  retries = 1

  sec_name = "${ZYXEL_SNMP_USER}"
  sec_level = "authPriv"
  auth_protocol = "SHA"
  auth_password = "${ZYXEL_SNMP_AUTH_PASSWORD}"
  priv_protocol = "AES"
  priv_password = "${ZYXEL_SNMP_PRIV_PASSWORD}"

  [[inputs.snmp.table]]
    name = "zyxel_lldp"
    index_as_tag = true

    [[inputs.snmp.table.field]]
      name = "remote_system_name"
      oid = ".1.0.8802.1.1.2.1.4.1.1.9"

    [[inputs.snmp.table.field]]
      name = "remote_system_description"
      oid = ".1.0.8802.1.1.2.1.4.1.1.10"

    [[inputs.snmp.table.field]]
      name = "remote_chassis_id"
      oid = ".1.0.8802.1.1.2.1.4.1.1.5"
      conversion = "hex"

    [[inputs.snmp.table.field]]
      name = "remote_port_id"
      oid = ".1.0.8802.1.1.2.1.4.1.1.7"


