# Zyxel XS1930-10 hardware monitoring
[[inputs.snmp]]
  agents = ["udp://192.168.10.7:161"]
  version = 3
  agent_host_tag = "source"
  interval = "15s"
  timeout = "5s"
  retries = 1

  sec_name = "${ZYXEL_SNMP_USER}"
  sec_level = "authPriv"
  auth_protocol = "SHA"
  auth_password = "${ZYXEL_SNMP_AUTH_PASSWORD}"
  priv_protocol = "AES"
  priv_password = "${ZYXEL_SNMP_PRIV_PASSWORD}"

  # ZYXEL-HW-MONITOR-MIB: Temperature
  [[inputs.snmp.table]]
    name = "zyxel_temperature"
    index_as_tag = true

    [[inputs.snmp.table.field]]
      name = "sensor"
      oid = ".1.3.6.1.4.1.890.1.15.3.26.1.2.1.2"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "current"
      oid = ".1.3.6.1.4.1.890.1.15.3.26.1.2.1.3"

    [[inputs.snmp.table.field]]
      name = "maximum"
      oid = ".1.3.6.1.4.1.890.1.15.3.26.1.2.1.4"

    [[inputs.snmp.table.field]]
      name = "minimum"
      oid = ".1.3.6.1.4.1.890.1.15.3.26.1.2.1.5"

    [[inputs.snmp.table.field]]
      name = "threshold"
      oid = ".1.3.6.1.4.1.890.1.15.3.26.1.2.1.6"

    [[inputs.snmp.table.field]]
      name = "status"
      oid = ".1.3.6.1.4.1.890.1.15.3.26.1.2.1.7"

  # ZYXEL-HW-MONITOR-MIB: Fan speed
  [[inputs.snmp.table]]
    name = "zyxel_fan"
    index_as_tag = true

    [[inputs.snmp.table.field]]
      name = "sensor"
      oid = ".1.3.6.1.4.1.890.1.15.3.26.1.1.1.2"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "current"
      oid = ".1.3.6.1.4.1.890.1.15.3.26.1.1.1.3"

    [[inputs.snmp.table.field]]
      name = "maximum"
      oid = ".1.3.6.1.4.1.890.1.15.3.26.1.1.1.4"

    [[inputs.snmp.table.field]]
      name = "minimum"
      oid = ".1.3.6.1.4.1.890.1.15.3.26.1.1.1.5"

    [[inputs.snmp.table.field]]
      name = "threshold"
      oid = ".1.3.6.1.4.1.890.1.15.3.26.1.1.1.6"

    [[inputs.snmp.table.field]]
      name = "status"
      oid = ".1.3.6.1.4.1.890.1.15.3.26.1.1.1.7"

  # ZYXEL-HW-MONITOR-MIB: Voltage in mV
  [[inputs.snmp.table]]
    name = "zyxel_voltage"
    index_as_tag = true

    [[inputs.snmp.table.field]]
      name = "sensor"
      oid = ".1.3.6.1.4.1.890.1.15.3.26.1.3.1.2"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "current"
      oid = ".1.3.6.1.4.1.890.1.15.3.26.1.3.1.3"

    [[inputs.snmp.table.field]]
      name = "maximum"
      oid = ".1.3.6.1.4.1.890.1.15.3.26.1.3.1.4"

    [[inputs.snmp.table.field]]
      name = "minimum"
      oid = ".1.3.6.1.4.1.890.1.15.3.26.1.3.1.5"

    [[inputs.snmp.table.field]]
      name = "nominal"
      oid = ".1.3.6.1.4.1.890.1.15.3.26.1.3.1.6"

    [[inputs.snmp.table.field]]
      name = "threshold"
      oid = ".1.3.6.1.4.1.890.1.15.3.26.1.3.1.7"

    [[inputs.snmp.table.field]]
