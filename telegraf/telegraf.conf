# Zyxel XS1930-10 LLDP neighbours
[[inputs.snmp]]
  agents = ["udp://192.168.10.7:161"]
  version = 3
  agent_host_tag = "source"
  interval = "300s"
  timeout = "5s"
  retries = 1

  sec_name = "${ZYXEL_SNMP_USER}"
  sec_level = "authPriv"
  auth_protocol = "SHA"
  auth_password = "${ZYXEL_SNMP_AUTH_PASSWORD}"
  priv_protocol = "AES"
  priv_password = "${ZYXEL_SNMP_PRIV_PASSWORD}"

  [[inputs.snmp.table]]
    name = "zyxel_lldp"
    index_as_tag = true

    [[inputs.snmp.table.field]]
      name = "remote_system_name"
