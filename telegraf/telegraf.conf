[agent]
  interval = "60s"
  flush_interval = "60s"
  hostname = "pi-monitor"
  omit_hostname = false

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"

[[inputs.cpu]]
  percpu = false
  totalcpu = true

[[inputs.mem]]

[[inputs.system]]

[[inputs.disk]]
  mount_points = ["/"]
  ignore_fs = ["tmpfs", "devtmpfs", "overlay", "squashfs"]

[[inputs.snmp]]
  name = "idrac"
  agents = ["udp://192.168.10.26:161"]
  version = 3
  agent_host_tag = "source"
  interval = "60s"
  timeout = "5s"
  retries = 1

  sec_name = "${IDRAC_SNMP_USER}"
  sec_level = "authPriv"
  auth_protocol = "SHA"
  auth_password = "${IDRAC_SNMP_AUTH_PASSWORD}"
  priv_protocol = "AES"
  priv_password = "${IDRAC_SNMP_PRIV_PASSWORD}"

  [[inputs.snmp.field]]
    name = "sysName"
    oid = ".1.3.6.1.2.1.1.5.0"
    is_tag = true

  [[inputs.snmp.field]]
    name = "uptime"
    oid = ".1.3.6.1.2.1.1.3.0"
  [[inputs.snmp.field]]
    name = "system_status"
    oid = ".1.3.6.1.4.1.674.10892.5.2.1.0"

  [[inputs.snmp.field]]
    name = "storage_status"
    oid = ".1.3.6.1.4.1.674.10892.5.2.3.0"

  [[inputs.snmp.field]]
    name = "power_state"
    oid = ".1.3.6.1.4.1.674.10892.5.2.4.0"

  [[inputs.snmp.table]]
    name = "idrac_temperature"
    inherit_tags = ["sysName"]
    index_as_tag = true

    [[inputs.snmp.table.field]]
      name = "sensor"
      oid = ".1.3.6.1.4.1.674.10892.5.4.700.20.1.8"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "temperature_c"
      oid = ".1.3.6.1.4.1.674.10892.5.4.700.20.1.6"
      conversion = "float(1)"

    [[inputs.snmp.table.field]]
      name = "status"
      oid = ".1.3.6.1.4.1.674.10892.5.4.700.20.1.5"

  [[inputs.snmp.table]]
    name = "idrac_fan"
    inherit_tags = ["sysName"]
    index_as_tag = true

    [[inputs.snmp.table.field]]
      name = "fan"
      oid = ".1.3.6.1.4.1.674.10892.5.4.700.12.1.8"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "rpm"
      oid = ".1.3.6.1.4.1.674.10892.5.4.700.12.1.6"

    [[inputs.snmp.table.field]]
      name = "status"
      oid = ".1.3.6.1.4.1.674.10892.5.4.700.12.1.5"

  [[inputs.snmp.table]]
    name = "idrac_psu"
    inherit_tags = ["sysName"]
    index_as_tag = true

    [[inputs.snmp.table.field]]
      name = "psu"
      oid = ".1.3.6.1.4.1.674.10892.5.4.600.12.1.8"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "status"
      oid = ".1.3.6.1.4.1.674.10892.5.4.600.12.1.5"

  [[inputs.snmp.table]]
    name = "idrac_power"
    inherit_tags = ["sysName"]
    index_as_tag = true

    [[inputs.snmp.table.field]]
      name = "sensor"
      oid = ".1.3.6.1.4.1.674.10892.5.4.600.30.1.8"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "probe_type"
      oid = ".1.3.6.1.4.1.674.10892.5.4.600.30.1.7"

    [[inputs.snmp.table.field]]
      name = "reading_raw"
      oid = ".1.3.6.1.4.1.674.10892.5.4.600.30.1.6"

    [[inputs.snmp.table.field]]
      name = "status"
      oid = ".1.3.6.1.4.1.674.10892.5.4.600.30.1.5"

  [[inputs.snmp.table]]
    name = "idrac_disk"
    inherit_tags = ["sysName"]
    index_as_tag = true

    [[inputs.snmp.table.field]]
      name = "disk"
      oid = ".1.3.6.1.4.1.674.10892.5.5.1.20.130.4.1.2"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "state"
      oid = ".1.3.6.1.4.1.674.10892.5.5.1.20.130.4.1.4"

  [[inputs.snmp.table]]
    name = "idrac_controller"
    inherit_tags = ["sysName"]
    index_as_tag = true

    [[inputs.snmp.table.field]]
      name = "controller"
      oid = ".1.3.6.1.4.1.674.10892.5.5.1.20.130.1.1.2"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "rollup_status"
      oid = ".1.3.6.1.4.1.674.10892.5.5.1.20.130.1.1.37"

    [[inputs.snmp.table.field]]
      name = "component_status"
      oid = ".1.3.6.1.4.1.674.10892.5.5.1.20.130.1.1.38"

  [[inputs.snmp.table]]
    name = "idrac_virtual_disk"
    inherit_tags = ["sysName"]
    index_as_tag = true

    [[inputs.snmp.table.field]]
      name = "virtual_disk"
      oid = ".1.3.6.1.4.1.674.10892.5.5.1.20.140.1.1.2"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "state"
      oid = ".1.3.6.1.4.1.674.10892.5.5.1.20.140.1.1.4"

    [[inputs.snmp.table.field]]
      name = "raid_layout"
      oid = ".1.3.6.1.4.1.674.10892.5.5.1.20.140.1.1.13"

    [[inputs.snmp.table.field]]
      name = "component_status"
      oid = ".1.3.6.1.4.1.674.10892.5.5.1.20.140.1.1.20"

  [[inputs.snmp.table]]
    name = "idrac_enclosure"
    inherit_tags = ["sysName"]
    index_as_tag = true

    [[inputs.snmp.table.field]]
      name = "enclosure"
      oid = ".1.3.6.1.4.1.674.10892.5.5.1.20.130.3.1.2"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "state"
      oid = ".1.3.6.1.4.1.674.10892.5.5.1.20.130.3.1.4"

    [[inputs.snmp.table.field]]
      name = "rollup_status"
      oid = ".1.3.6.1.4.1.674.10892.5.5.1.20.130.3.1.23"

  [[inputs.snmp.table]]
    name = "idrac_memory"
    inherit_tags = ["sysName"]
    index_as_tag = true

    [[inputs.snmp.table.field]]
      name = "dimm"
      oid = ".1.3.6.1.4.1.674.10892.5.4.1100.50.1.8"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "status"
      oid = ".1.3.6.1.4.1.674.10892.5.4.1100.50.1.5"

  [[inputs.snmp.table]]
    name = "idrac_cpu"
    inherit_tags = ["sysName"]
    index_as_tag = true

    [[inputs.snmp.table.field]]
      name = "status"
      oid = ".1.3.6.1.4.1.674.10892.5.4.1100.30.1.5"














[[inputs.http]]
  urls = [
    "https://192.168.10.26/redfish/v1/Chassis/System.Embedded.1/PCIeDevices/59-0",
    "https://192.168.10.26/redfish/v1/Chassis/System.Embedded.1/PCIeDevices/94-0"
  ]
  interval = "60s"
  timeout = "10s"
  username = "${IDRAC_REDFISH_USER}"
  password = "${IDRAC_REDFISH_PASSWORD}"
  insecure_skip_verify = true
  data_format = "json_v2"

  [inputs.http.tags]
    source = "192.168.10.26"

  [[inputs.http.json_v2]]
    measurement_name = "idrac_pcie"

    [[inputs.http.json_v2.tag]]
      path = "Id"
      rename = "device"

    [[inputs.http.json_v2.tag]]
      path = "Name"
      rename = "device_name"

    [[inputs.http.json_v2.field]]
      path = "Status.Health"
      rename = "health"
      type = "string"

    [[inputs.http.json_v2.field]]
      path = "Status.State"
      rename = "state"
      type = "string"

    [[inputs.http.json_v2.field]]
      path = "Slot.Location.PartLocation.LocationOrdinalValue"
      rename = "slot"
      type = "int"
